<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRUEBA MÚSICA - Para Jery ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f5e6d3;
            padding: 20px;
        }

        .debug {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.9);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            z-index: 9999;
            max-width: 90vw;
            max-height: 300px;
            overflow-y: auto;
        }

        .debug .error { color: #f00; }
        .debug .success { color: #0f0; }
        .debug .info { color: #ff0; }

        .heart-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 80px;
            height: 80px;
            background-color: #c41e3a;
            cursor: pointer;
            z-index: 10;
        }
        .heart-main::before, .heart-main::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #c41e3a;
            border-radius: 50%;
        }
        .heart-main::before { top: -40px; left: 0; }
        .heart-main::after { top: 0; left: 40px; }

        .tap-text { 
            position: absolute; 
            top: 60%; 
            left: 50%;
            transform: translateX(-50%);
            color: #c41e3a; 
            font-size: 1.2rem;
            text-align: center;
        }

        .test-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #c41e3a;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            z-index: 9998;
        }
    </style>
</head>
<body>
    <div class="debug" id="debug"></div>
    
    <div id="heart" class="heart-main" onclick="iniciar()"></div>
    <div class="tap-text">Toca el corazón, Jery ❤️</div>
    
    <button class="test-btn" onclick="probarMusica()">🎵 Probar Música</button>

    <!-- MÚSICA CON MÚLTIPLES FORMATOS -->
    <audio id="love-song" preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        <source src="musica.ogg" type="audio/ogg">
        <source src="musica.wav" type="audio/wav">
    </audio>

    <script>
        const debug = document.getElementById('debug');
        
        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const span = document.createElement('div');
            span.className = type;
            span.textContent = `[${time}] ${msg}`;
            debug.appendChild(span);
            debug.scrollTop = debug.scrollHeight;
            console.log(msg);
        }

        // Verificar audio al cargar
        window.addEventListener('load', () => {
            const audio = document.getElementById('love-song');
            
            log('🔍 Iniciando diagnóstico...', 'info');
            log('📍 URL actual: ' + window.location.href, 'info');
            log('📍 URL base: ' + window.location.origin, 'info');
            
            // Verificar si el elemento existe
            if (!audio) {
                log('❌ ERROR: Elemento de audio no encontrado', 'error');
                return;
            }
            log('✅ Elemento de audio encontrado', 'success');
            
            // Verificar el source
            const sources = audio.getElementsByTagName('source');
            log(`📂 Fuentes de audio: ${sources.length}`, 'info');
            for (let i = 0; i < sources.length; i++) {
                log(`  - ${sources[i].src}`, 'info');
            }
            
            // Eventos de audio
            audio.addEventListener('loadstart', () => log('⏳ Intentando cargar audio...', 'info'));
            audio.addEventListener('loadeddata', () => log('✅ Audio cargado correctamente', 'success'));
            audio.addEventListener('canplay', () => log('✅ Audio listo para reproducir', 'success'));
            audio.addEventListener('playing', () => log('🎵 REPRODUCIENDO MÚSICA', 'success'));
            audio.addEventListener('pause', () => log('⏸️ Audio pausado', 'info'));
            audio.addEventListener('ended', () => log('⏹️ Audio terminado', 'info'));
            
            audio.addEventListener('error', (e) => {
                log('❌ ERROR DE AUDIO:', 'error');
                log(`  Código: ${audio.error?.code}`, 'error');
                log(`  Mensaje: ${audio.error?.message || 'Sin mensaje'}`, 'error');
                
                const errorCodes = {
                    1: 'MEDIA_ERR_ABORTED - Descarga abortada',
                    2: 'MEDIA_ERR_NETWORK - Error de red',
                    3: 'MEDIA_ERR_DECODE - Error de decodificación',
                    4: 'MEDIA_ERR_SRC_NOT_SUPPORTED - Formato no soportado o archivo no encontrado'
                };
                log(`  Descripción: ${errorCodes[audio.error?.code] || 'Error desconocido'}`, 'error');
            });

            // Verificar si el archivo existe
            fetch('musica.mp3', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        log('✅ Archivo musica.mp3 encontrado en el servidor', 'success');
                        log(`  Tamaño: ${response.headers.get('content-length')} bytes`, 'info');
                        log(`  Tipo: ${response.headers.get('content-type')}`, 'info');
                    } else {
                        log(`❌ Archivo musica.mp3 NO encontrado (${response.status})`, 'error');
                    }
                })
                .catch(err => {
                    log('❌ Error al verificar archivo: ' + err.message, 'error');
                });
        });

        function probarMusica() {
            const audio = document.getElementById('love-song');
            log('🎵 Intentando reproducir música manualmente...', 'info');
            
            audio.play()
                .then(() => {
                    log('✅ ¡MÚSICA REPRODUCIENDO EXITOSAMENTE!', 'success');
                    log('  Volumen: ' + audio.volume, 'info');
                    log('  Duración: ' + audio.duration + 's', 'info');
                })
                .catch(error => {
                    log('❌ ERROR al reproducir:', 'error');
                    log(`  Nombre: ${error.name}`, 'error');
                    log(`  Mensaje: ${error.message}`, 'error');
                    
                    if (error.name === 'NotAllowedError') {
                        log('  → El navegador bloqueó la reproducción automática', 'error');
                        log('  → Solución: El usuario debe interactuar primero', 'info');
                    } else if (error.name === 'NotSupportedError') {
                        log('  → Formato de audio no soportado', 'error');
                    }
                });
        }

        function iniciar() {
            log('❤️ CORAZÓN TOCADO - Iniciando animación', 'success');
            probarMusica();
        }
    </script>
</body>
</html>
