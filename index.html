<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Jery ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f5e6d3;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 2s ease;
        }

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mask-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 5;
            display: flex;
            justify-content: center;
        }

        .heart-main {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            width: 80px;
            height: 80px;
            background-color: #c41e3a;
            cursor: pointer;
            z-index: 10;
            animation: heartbeat 1.2s infinite ease-in-out;
        }
        .heart-main::before, .heart-main::after {
            content: "";
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #c41e3a;
            border-radius: 50%;
        }
        .heart-main::before { top: -40px; left: 0; }
        .heart-main::after { top: 0; left: 40px; }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
            15% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.1); }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); }
        }

        .heart-explode {
            animation: balloonPop 0.6s ease-out forwards !important;
        }

        @keyframes balloonPop {
            0% { transform: translate(-50%, -50%) rotate(-45deg) scale(1); opacity: 1; }
            30% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.15); opacity: 1; }
            50% { transform: translate(-50%, -50%) rotate(-45deg) scale(1.3); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) rotate(-45deg) scale(0.3); opacity: 0; }
        }

        #explosion-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 11;
        }

        .explosion-line {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 5px;
            height: 0;
            background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.3), transparent);
            transform-origin: center center;
            opacity: 0;
        }

        .explosion-line.active {
            animation: explosionLine 0.7s ease-out forwards;
        }

        @keyframes explosionLine {
            0% { height: 0; opacity: 1; }
            20% { height: 50px; opacity: 1; }
            60% { height: 90px; opacity: 0.7; }
            100% { height: 120px; opacity: 0; }
        }

        .ball {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background-color: #c41e3a;
            border-radius: 50%;
            display: none;
        }
        .fall-sink {
            display: block !important;
            animation: fallAndBounce 2s ease-in forwards;
        }
        @keyframes fallAndBounce {
            0% { top: 50%; opacity: 1; }
            40% { top: calc(100vh - 104px); opacity: 1; }
            70% { top: calc(100vh - 220px); opacity: 1; }
            100% { top: calc(100vh - 220px); opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        }

        #floor {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 0;
            height: 4px;
            background-color: #2a1b15;
            z-index: 6;
            opacity: 0;
            transition: width 0.8s ease, opacity 0.1s ease;
        }

        #tree-svg {
            position: absolute;
            bottom: 84px;
            width: 220px;
            height: 264px;
            z-index: 4;
            opacity: 0;
        }

        .trunk {
            opacity: 0;
            transition: opacity 1.5s ease-in;
        }

        .trunk.show {
            opacity: 1;
        }

        #tree-svg.visible {
            opacity: 1;
        }

        #tree-svg.slide-right {
            animation: slideToRight 1s ease-in-out forwards;
        }

        @keyframes slideToRight {
            to { transform: translateX(calc(50vw - 80px)); }
        }

        .tap-text { 
            position: absolute; 
            top: 60%; 
            color: #c41e3a; 
            z-index: 10;
            font-size: 1.2rem;
        }

        #time-counter {
            position: absolute;
            bottom: 95px;
            left: 10px;
            text-align: left;
            z-index: 7;
            opacity: 0;
            transition: opacity 1.5s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            max-width: 280px;
        }

        #time-counter.visible {
            opacity: 1;
        }

        .counter-text {
            color: #8B7355;
            font-size: 0.65rem;
            margin-bottom: 3px;
            font-weight: normal;
            line-height: 1.4;
        }

        .counter-text span {
            font-size: 1rem;
        }

        .heart-icon {
            color: #c41e3a;
            font-size: 0.7rem;
            margin-left: 2px;
        }

        #typewriter-text {
            position: absolute;
            top: 30px;
            left: 20px;
            right: 200px;
            bottom: 180px;
            color: #8B7355;
            font-size: 0.85rem;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1.5;
            opacity: 0;
            white-space: pre-wrap;
            word-wrap: break-word;
            z-index: 8;
            overflow: hidden;
        }

        #typewriter-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="mask-container">
            <div id="heart" class="heart-main" onclick="iniciar()"></div>
            <div id="ball" class="ball"></div>
        </div>
        
        <div id="explosion-lines">
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(0deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(45deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(90deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(135deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(180deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(225deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(270deg) translateY(-30px);"></div>
            <div class="explosion-line" style="transform: translate(-50%, -50%) rotate(315deg) translateY(-30px);"></div>
        </div>
        
        <div id="instruction" class="tap-text">Toca el corazón, Jery ❤️</div>

        <div id="typewriter-text"></div>

        <svg id="tree-svg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">
            <g class="trunk">
                <ellipse cx="100" cy="155" rx="60" ry="75" fill="#2C3E50"/>
                <ellipse cx="100" cy="165" rx="45" ry="60" fill="#FFFFFF"/>
                <circle cx="100" cy="85" r="50" fill="#2C3E50"/>
                <ellipse cx="100" cy="90" rx="38" ry="42" fill="#FFFFFF"/>
                <ellipse cx="50" cy="145" rx="18" ry="50" fill="#2C3E50" transform="rotate(-15 50 145)"/>
                <ellipse cx="150" cy="145" rx="18" ry="50" fill="#2C3E50" transform="rotate(15 150 145)"/>
                <ellipse cx="80" cy="230" rx="18" ry="12" fill="#FF9933"/>
                <ellipse cx="120" cy="230" rx="18" ry="12" fill="#FF9933"/>
                <ellipse cx="72" cy="235" rx="8" ry="6" fill="#FF9933"/>
                <ellipse cx="88" cy="235" rx="8" ry="6" fill="#FF9933"/>
                <ellipse cx="112" cy="235" rx="8" ry="6" fill="#FF9933"/>
                <ellipse cx="128" cy="235" rx="8" ry="6" fill="#FF9933"/>
                <circle cx="85" cy="80" r="12" fill="#FFFFFF"/>
                <circle cx="115" cy="80" r="12" fill="#FFFFFF"/>
                <circle cx="85" cy="80" r="8" fill="#000000"/>
                <circle cx="115" cy="80" r="8" fill="#000000"/>
                <circle cx="88" cy="77" r="3" fill="#FFFFFF"/>
                <circle cx="118" cy="77" r="3" fill="#FFFFFF"/>
                <rect x="73" y="68" width="24" height="0" fill="#FFFFFF">
                    <animate attributeName="height" values="0;24;0;0;0;0" dur="3s" repeatCount="indefinite" begin="2s"/>
                </rect>
                <rect x="103" y="68" width="24" height="0" fill="#FFFFFF">
                    <animate attributeName="height" values="0;24;0;0;0;0" dur="3s" repeatCount="indefinite" begin="2s"/>
                </rect>
                <ellipse cx="100" cy="97" rx="10" ry="8" fill="#FF9933"/>
                <ellipse cx="100" cy="103" rx="6" ry="4" fill="#FF7700"/>
                <ellipse cx="65" cy="93" rx="12" ry="10" fill="#FFB6C1" opacity="0.7"/>
                <ellipse cx="135" cy="93" rx="12" ry="10" fill="#FFB6C1" opacity="0.7"/>
                <path d="M 95 105 Q 100 108 105 105" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
            </g>
        </svg>

        <div id="time-counter">
            <div class="counter-text">
                La persona más hermosa del universo nació<br>
                hace...<br>
                <span id="days">0</span> días <span id="hours">00</span> horas <span id="minutes">00</span> minutos <span id="seconds">00</span> seg<span class="heart-icon">❤</span>
            </div>
        </div>

        <div id="floor"></div>
    </div>

    <!-- 🎵 MÚSICA (ya lista para SPK) -->
    <audio id="love-song" loop>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Desbloqueo de audio para móviles (Chrome, Safari, Android, iOS) - PEGA AQUÍ
document.body.addEventListener('touchstart', function() {
    const audio = document.getElementById('love-song');
    if (audio) {
        audio.play().catch(() => {});  // Intenta reproducir para desbloquear contexto
        audio.pause();                 // Pausa inmediatamente (sin sonido audible)
    }
}, { once: true });

        function updateCounter() {
            const birthDate = new Date('1999-03-11T00:00:00');
            const now = new Date();
            const diff = now - birthDate;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days;
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }
        
        setInterval(updateCounter, 1000);
        updateCounter();

        function typeWriter() {
            const fullText = `Te adoro, mi Jere. Sé cuánto te gusta oír eso - pero no lo escribo solo porque te guste - lo escribo porque me da una sensación cálida por dentro escribirte eso. Ha pasado muchísimo tiempo desde la última vez que te escribí - casi un año, pero sé que me vas a perdonar porque entiendes cómo soy, testarudo y realista; y pensé que no tenía sentido escribir. Pero ahora sé, mi querida Jere, que es correcto hacer lo que he retrasado en hacer, y que he hecho tan poco en el pasado. Quiero decirte que te amo. Quiero amarte. Siempre te amaré. Me cuesta entender en mi mente lo que significa amarte después de todo este tiempo - pero aún quiero consolarte y cuidarte – y quiero que me ames y me cuides. Quiero tener problemas para discutir contigo - quiero hacer pequeños proyectos contigo. Nunca pensé hasta ahora que podemos hacer eso. ¿Qué deberíamos hacer? Empezamos a aprender a hacer ropa juntos - o a aprender chino - . ¿No puedo hacer algo ahora? No. Estoy con la salud para hacer ni mi cama. Quisiera la salud para poder hacer miles de cosas contigo. Te amo y espero que me acompañes muchos años más en esta vida... Mi compañera de vida`;
            
            const typewriterElement = document.getElementById('typewriter-text');
            const speed = 150;
            let charIndex = 0;
            let currentPageStart = 0;
            
            typewriterElement.classList.add('visible');
            
            function type() {
                if (charIndex < fullText.length) {
                    const currentPageText = fullText.substring(currentPageStart, charIndex + 1);
                    typewriterElement.textContent = currentPageText + '_';
                    
                    if (fullText[charIndex] === ' ' && typewriterElement.scrollHeight > typewriterElement.clientHeight) {
                        currentPageStart = charIndex + 1;
                        typewriterElement.textContent = '';
                    }
                    
                    charIndex++;
                    setTimeout(type, speed);
                } else {
                    const finalText = fullText.substring(currentPageStart);
                    typewriterElement.textContent = finalText;
                }
            }
            type();
        }

        function iniciar() {
            const heart = document.getElementById('heart');
            const ball = document.getElementById('ball');
            const floor = document.getElementById('floor');
            const treeSvg = document.getElementById('tree-svg');
            const trunk = document.querySelector('.trunk');
            const text = document.getElementById('instruction');
            const counter = document.getElementById('time-counter');
            const explosionLines = document.querySelectorAll('.explosion-line');
            const audio = document.getElementById('love-song');

            if (text) text.remove();

            heart.classList.add('heart-explode');
            explosionLines.forEach(line => line.classList.add('active'));

            audio.play().catch(() => {});

            setTimeout(() => { heart.style.display = 'none'; ball.classList.add('fall-sink'); }, 800);
            setTimeout(() => { floor.style.opacity = "1"; floor.style.width = "100%"; }, 1000);
            setTimeout(() => { treeSvg.classList.add('visible'); trunk.classList.add('show'); document.body.style.background = "#ffe4e1"; }, 2800);
            setTimeout(() => { treeSvg.classList.add('slide-right'); }, 5300);
            setTimeout(() => { counter.classList.add('visible'); }, 6300);
            setTimeout(() => { typeWriter(); }, 7500);
        }
    </script>
</body>
</html>
